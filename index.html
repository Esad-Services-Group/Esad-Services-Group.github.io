<!doctype html>
<meta charset="utf-8">
<title>ESAD Portal</title>
<link rel="icon" type="image/png" href="https://esadservices.com/wp-content/uploads/2025/02/EsadLogowithouttext-01.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="container py-4" style="max-width: 900px; font-family: 'Segoe UI', Arial, sans-serif;">

  <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-4">
    <img src="https://esadservices.com/wp-content/uploads/2025/02/EsadLogowithouttext-01.png" alt="ESAD" style="height: 48px; width: auto;">
    <h1 class="h4 mb-0 text-dark">ESAD Portal</h1>
  </div>

  <h2 class="h5 mb-3 text-dark">Apps</h2>
  <div id="apps" class="row row-cols-1 row-cols-md-3 g-3 mb-4"></div>

  <hr class="mb-4">

  <h2 class="h5 mb-3 text-dark">Microsoft 365</h2>
  <div id="links" class="row row-cols-2 row-cols-md-4 g-3"></div>
</div>

<script>
(function () {
  // ===== EDIT HERE =====
  const APPS = [
    { name: "Approvals", sub: "Requests and sign-offs",     icon: "bi-check2-square", href: "approvals.html" },
    { name: "Documents", sub: "Company files and policies", icon: "bi-folder2-open",  href: "documents.html" },
    { name: "Projects",  sub: "Projects and tasks",         icon: "bi-kanban",        href: "project-management.html" },
  ];
  const LINKS = [
    { name: "Outlook",    icon: "bi-envelope",        href: "https://outlook.office.com/mail/" },
    { name: "Teams",      icon: "bi-microsoft-teams", href: "https://teams.microsoft.com/" },
    { name: "SharePoint", icon: "bi-share",           href: "https://esadtalents.sharepoint.com/" },
    { name: "OneDrive",   icon: "bi-cloud",           href: "https://esadtalents-my.sharepoint.com/" },
  ];
  // =====================

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  document.getElementById("apps").innerHTML = APPS.map(a => `
    <div class="col">
      <a href="${esc(a.href)}" class="card h-100 bg-light border text-decoration-none text-reset">
        <div class="card-body p-3 d-flex align-items-center gap-3">
          <i class="bi ${esc(a.icon)} fs-3 text-primary"></i>
          <div>
            <p class="fw-semibold mb-0" style="font-size: 14px;">${esc(a.name)}</p>
            <p class="text-muted mb-0" style="font-size: 12px;">${esc(a.sub)}</p>
          </div>
          <i class="bi bi-chevron-right text-secondary ms-auto"></i>
        </div>
      </a>
    </div>`).join("");

  document.getElementById("links").innerHTML = LINKS.map(l => `
    <div class="col">
      <a href="${esc(l.href)}" target="_blank" rel="noopener" class="card h-100 bg-light border text-decoration-none text-reset">
        <div class="card-body p-3 d-flex align-items-center gap-2">
          <i class="bi ${esc(l.icon)} text-secondary"></i>
          <span class="small">${esc(l.name)}</span>
          <i class="bi bi-box-arrow-up-right text-secondary ms-auto" style="font-size: 11px;"></i>
        </div>
      </a>
    </div>`).join("");

  document.querySelectorAll("a.card").forEach(el => {
    el.addEventListener("mouseenter", () => el.classList.add("shadow-sm"));
    el.addEventListener("mouseleave", () => el.classList.remove("shadow-sm"));
  });
})();
</script>

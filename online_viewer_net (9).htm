  }

  /* ---------- routing ---------- */
  function parseHash(h = location.hash) {
    const [name, arg] = String(h || '').replace(/^#\/?/, '').split('/');
    return { name: name || 'home', id: /^\d+$/.test(arg || '') ? Number(arg) : null };
  }
  function renderView(hash) {
    const r = parseHash(hash);
    if (r.name === 'project' && r.id) renderProject(r.id);
    else if (r.name === 'projects') renderProjects();
    else if (r.name === 'mywork') renderMyWork();
    else if (r.name === 'approvals') renderApprovals();
    else renderHome();
    updateCounts();
  }
  // Re-render the current page in place (keeps scroll position and filters).
  function refresh() { renderView(parseHash().name === 'item' ? state.backHash : location.hash); }
  function onHashChange() {
    qs('#alertBox').innerHTML = '';
    const r = parseHash();
    qsa('.modal.show').forEach(m => { if (!(r.name === 'item' && m.id === 'itemModal')) bootstrap.Modal.getInstance(m)?.hide(); });
    if (r.name === 'item') {
      const it = r.id ? byId(state.items, r.id) : null;
      if (!it || !projectOf(it)) {
        history.replaceState(null, '', '#projects');
        renderView('#projects');
        showAlert("That work item doesn't exist anymore.");
        return;
      }
      state.backHash = '#project/' + it.projectId;
      renderView(state.backHash);
      window.scrollTo(0, 0);
      openItem(it);
      return;
    }
    renderView(location.hash);
    window.scrollTo(0, 0);
  }
  const currentProject = () => {
    const r = parseHash(parseHash().name === 'item' ? state.backHash : location.hash);
    return r.name === 'project' ? byId(state.projects, r.id) : null;
  };

  view.addEventListener('click', e => {
    const t = e.target;
    const act = t.closest('[data-act]');
    if (act) {
      const p = currentProject();
      switch (act.dataset.act) {
        case 'home-dept': state.hf.dept = act.dataset.value; renderHome(); window.scrollTo(0, 0); break;
        case 'new-project': openProject(null); break;
        case 'edit-project': if (p) openProject(p); break;
        case 'fields': if (p) openFields(p); break;
        case 'new-item': if (p) openItem(null, p); break;
        case 'clear-project-filters': state.pf = { q: '', scope: 'all', status: '', dept: '' }; renderProjects(); break;
        case 'clear-item-filters': if (p) { Object.assign(state.wf, { status: '', q: '', who: '' }); renderProject(p.id); } break;
        case 'wf-status':
          if (!p) break;
          state.wf.status = act.dataset.value;
          qsa('#wfStatus [data-act]').forEach(b => { const on = b.dataset.value === state.wf.status; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
          renderItemList(p);
          break;
      }
      return;
    }
    const set = t.closest('[data-set-status]');
    if (set) { setItemStatus(Number(set.dataset.id), set.dataset.setStatus); return; }
    const openLink = t.closest('[data-open-item]');
    if (openLink) { e.preventDefault(); const it = byId(state.items, Number(openLink.dataset.openItem)); if (it) openItem(it); return; }
    if (t.closest('a, button, input, select, textarea, label, .dropdown')) return;
    const deptRow = t.closest('tr[data-dept]');
    if (deptRow) { state.hf.dept = deptRow.dataset.dept; renderHome(); window.scrollTo(0, 0); return; }
    const row = t.closest('[data-href]');
    if (row) { location.hash = row.dataset.href; return; }
    const itemRow = t.closest('[data-item]');
    if (itemRow) { const it = byId(state.items, Number(itemRow.dataset.item)); if (it) openItem(it); }
  });

  // Quick status change from a table row. Shows the change at once and rolls back on failure.
  async function setItemStatus(id, status) {
    const it = byId(state.items, id);
    if (!it || it.status === status) return;
    const before = it.status;
    it.status = status;
    refresh();
    try {
      const saved = await api.saveItem({ ...it });
      upsert(state.items, saved);
      refresh();
      toast(`Moved to ${status}`);
    } catch (err) {
      it.status = before;
      if (err.status === 412) {
        const fresh = await api.getItem(id).catch(() => null);
        if (fresh) upsert(state.items, fresh);
        refresh();
        showAlert(`Someone else changed "${it.title}" just now. You're seeing their version; change the status again if it's still needed.`);
      } else {
        refresh();
        showAlert(`Couldn't change the status of "${it.title}": ${err.message}`);
      }
    }
  }

  /* ---------- project form ---------- */
  let projectCtx = null;
  const projectSnapshot = () => JSON.stringify([qs('#pmName').value, qs('#pmDesc').value, qs('#pmStatus').value, qs('#pmDept').value,
    projectCtx.owner.get().map(p => low(p.email)), projectCtx.owner.pending(), qsa('[data-cf]', qs('#pmCustom')).map(el => el.value)]);

  function openProject(p) {
    const ch = state.choices;
    projectCtx = { project: p, saved: false };
    qs('#pmHeading').textContent = p ? 'Edit project' : 'New project';
    qs('#pmName').value = p?.title || '';
    qs('#pmName').classList.remove('is-invalid');
    qs('#pmDesc').value = p?.description || '';
    qs('#pmStatus').innerHTML = options(ch.projectStatus.values, p ? p.status : (ch.projectStatus.default || ch.projectStatus.values[0]));
    qs('#pmDept').innerHTML = options(ch.department.values, p ? p.department : ch.department.default, '—');
    projectCtx.owner = makePicker(qs('#pmOwner'), { multi: false, value: p ? [p.owner] : [state.me], inputId: 'pmOwnerInput', invalidText: 'Choose an owner.' });
    const fields = p ? fieldsFor(p, 'project') : [];
    qs('#pmCustom').innerHTML = fields.length ? `<div class="border-top pt-3 mt-3">${customInputs(fields, p.custom)}</div>` : '';
    qs('#pmDelete').classList.toggle('d-none', !(p && (isMe(p.owner) || isMe(p.createdBy))));
    qs('#pmSave').textContent = p ? 'Save' : 'Create project';
    hideErr(qs('#projectModal'));
    projectCtx.snapshot = projectSnapshot();
    modal('#projectModal').show();
  }

  async function saveProject(e) {
    e.preventDefault();
    const p = projectCtx.project;
    const title = qs('#pmName').value.trim();
    const owner = projectCtx.owner.get()[0] || null;
    qs('#pmName').classList.toggle('is-invalid', !title);
    projectCtx.owner.invalid(!owner);
    if (!title) { qs('#pmName').focus(); return; }
    if (!owner) { projectCtx.owner.focus(); return; }
    const rec = {
      ...(p || { id: null, schema: [], custom: {} }),
      title, owner,
      description: qs('#pmDesc').value.trim(),
      status: qs('#pmStatus').value, department: qs('#pmDept').value,
      custom: p ? readCustom(qs('#pmCustom'), p.custom) : {},
    };
    const btn = qs('#pmSave');
    busy(btn, true);
    try {
      const saved = await api.saveProject(rec);
      upsert(state.projects, saved);
      projectCtx.saved = true;
      modal('#projectModal').hide();
      toast(p ? 'Project saved' : 'Project created');
      if (p) refresh(); else location.hash = '#project/' + saved.id;
    } catch (err) {
      await handleSaveError(err, 'project', p, qs('#projectModal'));
    } finally {
      busy(btn, false);
    }
  }

  async function deleteProject(btn) {
    const p = projectCtx.project;
    const items = state.items.filter(i => i.projectId === p.id);
    if (!confirm(`Delete "${p.title}"${items.length ? ` and its ${plural(items.length, 'work item')}` : ''}?`)) return;
    busy(btn, true, 'Deleting…');
    try {
      for (let i = 0; i < items.length; i += 4) {
        await Promise.all(items.slice(i, i + 4).map(it => api.deleteItem(it.id).catch(err => { if (err.status !== 404) throw err; })));
      }
      await api.deleteProject(p.id);
      state.items = state.items.filter(i => i.projectId !== p.id);
      state.projects = state.projects.filter(x => x.id !== p.id);
      projectCtx.saved = true;
      modal('#projectModal').hide();
      toast('Project deleted');
      location.hash = '#projects';
    } catch (err) {
      showErr(qs('#projectModal'), `Couldn't delete everything: ${err.message}`);
      await reload().catch(() => {});
      refresh();
    } finally {
      busy(btn, false);
    }
  }

  /* ---------- work item form ---------- */
  let itemCtx = null;
  const itemSnapshot = () => JSON.stringify([qs('#imName').value, qs('#imStatus').value, qs('#imDesc').value, itemCtx.who.get().map(p => low(p.email)), itemCtx.who.pending(),
    itemCtx.checklist, qs('#imCheckNew').value.trim(), qsa('[data-cf]', qs('#imCustom')).map(el => el.value)]);

  function openItem(it, project = it ? projectOf(it) : null) {
    if (!project) return;
    const ch = state.choices;
    itemCtx = { item: it, project, saved: false, checklist: (it?.checklist || []).map(c => ({ ...c })) };
    if (it && parseHash().name !== 'item') {
      state.backHash = location.hash || '#home';
      history.replaceState(null, '', '#item/' + it.id);   // shareable link while the item is open
    }
    qs('#imHeading').textContent = it ? 'Edit work item' : 'New work item';
    qs('#imProject').innerHTML = `in <a href="#project/${project.id}" class="text-decoration-none" data-act="go-project">${esc(project.title)}</a>`;
    qs('#imName').value = it?.title || '';
    qs('#imName').classList.remove('is-invalid');
    qs('#imStatus').innerHTML = options(ch.itemStatus.values, it ? it.status : (ch.itemStatus.default || ch.itemStatus.values[0]));
    itemCtx.who = makePicker(qs('#imWho'), { multi: true, value: it?.assignees || [], inputId: 'imWhoInput' });
    qs('#imDesc').value = it?.description || '';
    qs('#imCheckNew').value = '';
    drawChecklist();
    const cols = fieldsFor(project, 'workItem');
    qs('#imCustom').innerHTML = cols.length ? `<div class="mb-3">${customInputs(cols, it?.custom || {})}</div>` : '';
    qs('#imMeta').innerHTML = it ? `Created by ${nameOf(it.createdBy)} · ${when(it.created)}&nbsp;&nbsp;·&nbsp;&nbsp;Updated by ${nameOf(it.modifiedBy)} · ${when(it.modified)}` : '';
    qs('#imMeta').classList.toggle('d-none', !it);
    qs('#imDelete').classList.toggle('d-none', !it);
    qs('#imSave').textContent = it ? 'Save' : 'Create work item';
    hideErr(qs('#itemModal'));
    drawItemApprovals();
    updateAssignMe();
    itemCtx.snapshot = itemSnapshot();
    modal('#itemModal').show();
  }
  const updateAssignMe = () => { if (itemCtx) qs('#imAssignMe').classList.toggle('d-none', itemCtx.who.get().some(isMe)); };
  qs('#imWho').addEventListener('picker-change', updateAssignMe);

  function drawChecklist() {
    const list = itemCtx.checklist;
    qs('#imChecklist').innerHTML = list.length ? `<div class="list-group">${list.map((c, i) => `
      <div class="list-group-item bg-light d-flex align-items-center gap-2 py-1">
        <input class="form-check-input mt-0 flex-shrink-0" type="checkbox" data-check="${i}"${c.done ? ' checked' : ''} aria-label="Done">
        <input type="text" class="form-control form-control-sm border-0 bg-transparent px-1${c.done ? ' text-decoration-line-through text-secondary' : ''}" data-check-text="${i}" value="${esc(c.text)}" maxlength="255" aria-label="Checklist item">
        <button type="button" class="btn btn-link btn-sm text-secondary p-0" data-act="check-remove" data-i="${i}" aria-label="Remove item"><i class="bi bi-x-lg"></i></button>
      </div>`).join('')}</div>` : '';
    countChecklist();
  }
  function countChecklist() {
    const list = itemCtx.checklist;
    qs('#imCheckCount').textContent = list.length ? `${list.filter(c => c.done).length} of ${list.length} done` : '';
  }
  function addCheckItem() {
    const input = qs('#imCheckNew');
    const text = input.value.trim();
    if (!text) return;
    itemCtx.checklist.push({ text, done: false });
    input.value = '';
    drawChecklist();
    input.focus();
  }
  qs('#imChecklist').addEventListener('input', e => {
    const box = e.target.closest('[data-check]'), txt = e.target.closest('[data-check-text]');
    if (box) {
      itemCtx.checklist[Number(box.dataset.check)].done = box.checked;
      const field = qs(`[data-check-text="${box.dataset.check}"]`);
      field.classList.toggle('text-decoration-line-through', box.checked);
      field.classList.toggle('text-secondary', box.checked);
      countChecklist();
    } else if (txt) {
      itemCtx.checklist[Number(txt.dataset.checkText)].text = txt.value;
    }
  });
  qs('#imChecklist').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-check-text]')) { e.preventDefault(); qs('#imCheckNew').focus(); } });
  qs('#imCheckNew').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCheckItem(); } });

  // Approvals inside the work item
  function drawItemApprovals() {
    const it = itemCtx.item;
    const decisionBox = qs('#imDecision'), box = qs('#imApprovals');
    if (!it) {
      decisionBox.innerHTML = '';
      box.innerHTML = '<div class="small fw-semibold mb-1">Approvals</div><p class="small text-secondary mb-0">You can ask for approval once the work item is created.</p>';
      return;
    }
    const all = state.approvals.filter(a => a.itemId === it.id).sort((a, b) => time(a.created) - time(b.created));
    const mine = all.find(a => isMe(a.approver) && a.decision === ST.pending);
    const list = all.filter(a => a !== mine);   // your own pending request is shown in the box above instead
    decisionBox.innerHTML = mine ? `
      <div class="border border-warning-subtle bg-warning-subtle rounded p-3 mb-3">
        <div class="small mb-2"><i class="bi bi-hourglass-split text-warning-emphasis me-1"></i><strong>${esc(mine.createdBy?.name || 'Someone')}</strong> asked for your approval <span class="text-secondary">· ${when(mine.created)}</span></div>
        ${mine.note ? `<div class="small mb-2" style="white-space: pre-line;">${esc(mine.note)}</div>` : ''}
        <label class="form-label small fw-semibold mb-1" for="imDecisionNote">Comment <span class="fw-normal text-secondary">(optional)</span></label>
        <textarea class="form-control form-control-sm mb-2" id="imDecisionNote" rows="2"></textarea>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-success" data-act="decide" data-id="${mine.id}" data-decision="${esc(ST.approved)}"><i class="bi bi-check-lg me-1"></i>Approve</button>
          <button type="button" class="btn btn-sm btn-outline-danger bg-white" data-act="decide" data-id="${mine.id}" data-decision="${esc(ST.rejected)}"><i class="bi bi-x-lg me-1"></i>Reject</button>
        </div>
      </div>` : '';
    box.innerHTML = `
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="small fw-semibold">Approvals</div>
        <button type="button" class="btn btn-sm btn-outline-primary" data-act="ask-open"><i class="bi bi-send me-1"></i>Request approval</button>
      </div>
      <div class="border rounded bg-light p-3 mb-2 d-none" id="imAsk">
        <label class="form-label small fw-semibold mb-1" for="imAskInput">Approvers</label>
        <div id="imAskWho" class="mb-2"></div>
        <label class="form-label small fw-semibold mb-1" for="imAskNote">Message <span class="fw-normal text-secondary">(optional)</span></label>
        <textarea class="form-control form-control-sm mb-2" id="imAskNote" rows="2" placeholder="What should they check?"></textarea>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <button type="button" class="btn btn-sm btn-primary" data-act="ask-send">Send request</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-act="ask-cancel">Cancel</button>
          ${CFG.email && !CFG.demo ? '<span class="text-secondary ms-auto" style="font-size: 12px;"><i class="bi bi-envelope me-1"></i>Approvers get an email</span>' : ''}
        </div>
      </div>
      ${list.length ? `<div class="list-group">${list.map(approvalRow).join('')}</div>` : mine ? '' : '<p class="small text-secondary mb-0">No approvals requested yet.</p>'}`;
  }
  function approvalRow(a) {
    const decided = a.decision !== ST.pending;
    // Modified By is set by SharePoint, so it shows who really made the decision.
    const by = decided && a.modifiedBy && !samePerson(a.modifiedBy, a.approver) ? ` by ${nameOf(a.modifiedBy)}` : '';
    const right = decided ? `<span class="text-secondary ms-auto" style="font-size: 12px;">${when(a.modified)}</span>`
      : isMe(a.createdBy) ? `<button type="button" class="btn btn-link btn-sm p-0 text-decoration-none ms-auto" style="font-size: 12px;" data-act="ask-withdraw" data-id="${a.id}">Cancel request</button>` : '';
    return `<div class="list-group-item bg-light">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="small fw-semibold">${cap(nameOf(a.approver, 'Unknown'))}</span>
        <span class="small">${decisionText(a.decision, by)}</span>
        ${right}
      </div>
      <div class="text-secondary mt-1" style="font-size: 12px;">Requested by ${nameOf(a.createdBy)} · ${when(a.created)}${a.note ? `<div style="white-space: pre-line;">${esc(a.note)}</div>` : ''}</div>
      ${a.comment ? `<div class="mt-1" style="font-size: 12px; white-space: pre-line;"><i class="bi bi-reply text-secondary me-1"></i>${esc(a.comment)}</div>` : ''}
    </div>`;
  }

  function mailHtml(lines, itemId) {
    return `<div style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #212529;">${lines.filter(Boolean).map(l => `<p style="margin: 0 0 12px;">${l}</p>`).join('')}` +
      `<p style="margin: 0;"><a href="${esc(APP_URL + '#item/' + itemId)}" style="color: #0d6efd;">Open the work item</a></p></div>`;
  }
  const mailText = s => esc(s).replace(/\n/g, '<br>');

  async function sendApprovalRequest(btn) {
    const { item, project } = itemCtx;
    const approvers = itemCtx.ask.get();
    if (!approvers.length) {
      itemCtx.ask.invalid(true);
      itemCtx.ask.focus();
      return;
    }
    const note = qs('#imAskNote').value.trim();
    busy(btn, true, 'Sending…');
    try {
      for (const person of approvers) {
        upsert(state.approvals, await api.saveApproval({ id: null, itemId: item.id, title: item.title, approver: person, decision: ST.pending, note, comment: '' }));
      }
      drawItemApprovals();
      refresh();
      let mailed = false, mailError = '';
      try {
        mailed = await api.sendMail(approvers, `Approval needed: ${item.title}`, mailHtml([
          `${esc(state.me.name)} asked you to approve <strong>${esc(item.title)}</strong> in ${esc(project.title)}.`,
          note ? mailText(note) : '',
        ], item.id));
      } catch (err) { mailError = err.message; }
      if (mailError) showErr(qs('#itemModal'), `The request was saved, but the email couldn't be sent (${mailError}). Let ${approvers.map(p => p.name).join(', ')} know directly.`);
      toast(`Approval requested from ${approvers.map(p => p.name).join(', ')}${mailed ? '. Email sent.' : '.'}`);
    } catch (err) {
      showErr(qs('#itemModal'), `Couldn't send the request: ${err.message}`);
      busy(btn, false);
    }
  }

  async function decide(btn) {
    const a = byId(state.approvals, Number(btn.dataset.id));
    if (!a) return;
    const decision = btn.dataset.decision;
    const comment = qs('#imDecisionNote')?.value.trim() || '';
    busy(btn, true, decision === ST.approved ? 'Approving…' : 'Rejecting…');
    try {
      const saved = await api.saveApproval({ ...a, decision, comment });
      upsert(state.approvals, saved);
      drawItemApprovals();
      refresh();
      let mailed = false;
      if (a.createdBy?.email && !isMe(a.createdBy)) {
        mailed = await api.sendMail([a.createdBy], `${decision}: ${itemCtx.item.title}`, mailHtml([
          `${esc(state.me.name)} ${esc(low(decision))} <strong>${esc(itemCtx.item.title)}</strong> in ${esc(itemCtx.project.title)}.`,
          comment ? mailText(comment) : '',
        ], a.itemId)).catch(() => false);
      }
      toast(`${decision}${mailed ? `. ${a.createdBy.name} was emailed.` : '.'}`);
    } catch (err) {
      busy(btn, false);
      await handleSaveError(err, 'approval', a, qs('#itemModal'));
      drawItemApprovals();
    }
  }

  async function withdrawApproval(btn) {
    const a = byId(state.approvals, Number(btn.dataset.id));
    if (!a || !confirm(`Cancel the approval request to ${a.approver?.name || 'this person'}?`)) return;
    busy(btn, true, 'Cancelling…');
    try {
      await api.deleteApproval(a.id);
      state.approvals = state.approvals.filter(x => x.id !== a.id);
      drawItemApprovals();
      refresh();
      toast('Request cancelled');
    } catch (err) {
      busy(btn, false);
      showErr(qs('#itemModal'), `Couldn't cancel the request: ${err.message}`);
    }
  }

  async function saveItem(e) {
    e.preventDefault();
    const { item, project } = itemCtx;
    const title = qs('#imName').value.trim();
    qs('#imName').classList.toggle('is-invalid', !title);
    if (!title) { qs('#imName').focus(); return; }
    addCheckItem();   // keep an item typed into "Add an item" but not added yet
    const rec = {
      ...(item || { id: null, projectId: project.id }),
      title,
      status: qs('#imStatus').value,
      assignees: itemCtx.who.get(),
      description: qs('#imDesc').value.trim(),
      checklist: itemCtx.checklist.map(c => ({ text: c.text.trim(), done: c.done })).filter(c => c.text),
      custom: readCustom(qs('#imCustom'), item?.custom || {}),
    };
    const btn = qs('#imSave');
    busy(btn, true);
    try {
      const saved = await api.saveItem(rec);
      upsert(state.items, saved);
      itemCtx.saved = true;
      modal('#itemModal').hide();
      toast(item ? 'Work item saved' : 'Work item created');
      refresh();
    } catch (err) {
      await handleSaveError(err, 'item', item, qs('#itemModal'));
    } finally {
      busy(btn, false);
    }
  }

  async function deleteItem(btn) {
    const it = itemCtx.item;
    if (!confirm(`Delete "${it.title}"?`)) return;
    busy(btn, true, 'Deleting…');
    try {
      await api.deleteItem(it.id);
      state.items = state.items.filter(x => x.id !== it.id);
      itemCtx.saved = true;
      modal('#itemModal').hide();
      toast('Work item deleted');
      refresh();
    } catch (err) {
      showErr(qs('#itemModal'), `Couldn't delete: ${err.message}`);
    } finally {
      busy(btn, false);
    }
  }

  qs('#itemModal').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (!act || !itemCtx) return;
    switch (act.dataset.act) {
      case 'go-project': {
        e.preventDefault();
        if (!itemCtx.saved && itemSnapshot() !== itemCtx.snapshot && !confirm('Discard your unsaved changes?')) break;
        itemCtx.saved = true;
        const target = '#project/' + itemCtx.project.id;
        if (parseHash().name === 'item') history.replaceState(null, '', state.backHash);
        modal('#itemModal').hide();
        if (location.hash !== target) location.hash = target;
        break;
      }
      case 'assign-me': itemCtx.who.add(state.me); break;
      case 'check-add': addCheckItem(); break;
      case 'check-remove': itemCtx.checklist.splice(Number(act.dataset.i), 1); drawChecklist(); break;
      case 'ask-open': {
        const pendingFor = state.approvals.filter(a => a.itemId === itemCtx.item.id && a.decision === ST.pending).map(a => a.approver);
        qs('#imAsk').classList.remove('d-none');
        act.classList.add('d-none');
        itemCtx.ask = makePicker(qs('#imAskWho'), { multi: true, inputId: 'imAskInput', invalidText: 'Choose at least one approver.',
          exclude: p => isMe(p) || pendingFor.some(x => samePerson(x, p)) });
        itemCtx.ask.focus();
        break;
      }
      case 'ask-cancel': drawItemApprovals(); break;
      case 'ask-send': sendApprovalRequest(act); break;
      case 'ask-withdraw': withdrawApproval(act); break;
      case 'decide': decide(act); break;
      case 'delete-item': deleteItem(act); break;
    }
  });

  /* ---------- custom fields ---------- */
  let fieldsCtx = null;
  const fieldsSnapshot = () => JSON.stringify(fieldsCtx.schema);

  function openFields(p) {
    const schema = JSON.parse(JSON.stringify((p.schema || []).filter(f => f && f.id)));
    fieldsCtx = { project: p, schema, savedIds: new Set(schema.map(f => f.id)), saved: false };
    fieldsCtx.snapshot = fieldsSnapshot();
    qs('#fmProject').textContent = p.title;
    qs('#fmName').value = '';
    qs('#fmType').value = 'text';
    qs('#fmTarget').value = 'workItem';
    qs('#fmOpts').value = '';
    qs('#fmOptsWrap').classList.add('d-none');
    hideErr(qs('#fieldsModal'));
    drawFields();
    modal('#fieldsModal').show();
  }

  function drawFields() {
    const active = fieldsCtx.schema.filter(f => !f.archived);
    const removed = fieldsCtx.schema.filter(f => f.archived);
    qs('#fmList').innerHTML = (active.length ? `<div class="list-group">${active.map(f => `
      <div class="list-group-item bg-light">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-4"><input type="text" class="form-control form-control-sm" data-fname="${esc(f.id)}" value="${esc(f.name)}" maxlength="60" aria-label="Field name"></div>
          <div class="col-12 col-md-3 small text-secondary">${FIELD_TYPES[f.type] || 'Text'} · ${TARGETS[f.target] || TARGETS.workItem}</div>
          <div class="col-10 col-md-4">${f.type === 'choice' ? `<input type="text" class="form-control form-control-sm" data-fopts="${esc(f.id)}" value="${esc((f.options || []).join(', '))}" placeholder="Options, comma-separated" aria-label="Options for ${esc(f.name)}">` : ''}</div>
          <div class="col-2 col-md-1 text-end"><button type="button" class="btn btn-sm btn-outline-secondary" data-act="field-remove" data-id="${esc(f.id)}" title="Remove field" aria-label="Remove ${esc(f.name)}"><i class="bi bi-trash"></i></button></div>
        </div>
      </div>`).join('')}</div>` : '<p class="small text-secondary mb-0">No custom fields yet.</p>') +
      (removed.length ? `<div class="small text-secondary mt-3">Removed: ${removed.map(f => `${esc(f.name)} <button type="button" class="btn btn-link btn-sm p-0 align-baseline text-decoration-none" data-act="field-restore" data-id="${esc(f.id)}">Restore</button>`).join(', ')}
        <div style="font-size: 12px;">Removed fields keep their values, so restoring one brings everything back.</div></div>` : '');
  }

  function syncFieldInputs() {
    qsa('[data-fname]').forEach(el => { const f = fieldsCtx.schema.find(x => x.id === el.dataset.fname); if (f) f.name = el.value.trim(); });
    qsa('[data-fopts]').forEach(el => { const f = fieldsCtx.schema.find(x => x.id === el.dataset.fopts); if (f) f.options = splitOptions(el.value); });
  }
  const nameTaken = (name, exceptId) => fieldsCtx.schema.some(f => !f.archived && f.id !== exceptId && low(f.name) === low(name));

  function addField() {
    syncFieldInputs();
    const name = qs('#fmName').value.trim(), type = qs('#fmType').value, target = qs('#fmTarget').value;
    const opts = splitOptions(qs('#fmOpts').value);
    const problem = !name ? 'Give the new field a name.'
      : nameTaken(name) ? `There's already a field named "${name}".`
      : type === 'choice' && !opts.length ? 'Add at least one option, separated by commas.' : '';
    if (problem) { showErr(qs('#fieldsModal'), problem); return; }
    hideErr(qs('#fieldsModal'));
    fieldsCtx.schema.push({ id: newFieldId(new Set(fieldsCtx.schema.map(f => f.id))), name, type, target, ...(type === 'choice' ? { options: opts } : {}) });
    qs('#fmName').value = '';
    qs('#fmOpts').value = '';
    drawFields();
    qs('#fmName').focus();
  }

  async function saveFields(e) {
    e.preventDefault();
    syncFieldInputs();
    let problem = '';
    const seen = new Set();
    for (const f of fieldsCtx.schema.filter(x => !x.archived)) {
      if (!f.name) { problem = 'Every field needs a name.'; break; }
      if (seen.has(low(f.name))) { problem = `Two fields are named "${f.name}". Rename one of them.`; break; }
      seen.add(low(f.name));
      if (f.type === 'choice' && !(f.options || []).length) { problem = `Add at least one option for "${f.name}".`; break; }
    }
    if (!problem && qs('#fmName').value.trim()) problem = 'You typed a new field name but haven\'t added it. Click Add, or clear the name.';
    if (problem) { showErr(qs('#fieldsModal'), problem); return; }
    const p = fieldsCtx.project;
    const btn = qs('#fmSave');
    busy(btn, true);
    try {
      const saved = await api.saveProject({ ...p, schema: fieldsCtx.schema });
      upsert(state.projects, saved);
      fieldsCtx.saved = true;
      modal('#fieldsModal').hide();
      toast('Fields saved');
      refresh();
    } catch (err) {
      await handleSaveError(err, 'project', p, qs('#fieldsModal'));
    } finally {
      busy(btn, false);
    }
  }

  qs('#fieldsModal').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (!act || !fieldsCtx) return;
    syncFieldInputs();
    const f = fieldsCtx.schema.find(x => x.id === act.dataset.id);
    if (act.dataset.act === 'field-add') addField();
    else if (act.dataset.act === 'field-remove' && f) {
      if (fieldsCtx.savedIds.has(f.id)) f.archived = true;               // saved before: hide it, keep its values
      else fieldsCtx.schema = fieldsCtx.schema.filter(x => x.id !== f.id); // added just now: drop it
      drawFields();
    } else if (act.dataset.act === 'field-restore' && f) {
      if (nameTaken(f.name, f.id)) { showErr(qs('#fieldsModal'), `Rename the other "${f.name}" field before restoring this one.`); return; }
      delete f.archived;
      drawFields();
    }
  });
  qs('#fmType').addEventListener('change', e => qs('#fmOptsWrap').classList.toggle('d-none', e.target.value !== 'choice'));
  qsa('#fmName, #fmOpts').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addField(); } }));

  /* ---------- modal wiring ---------- */
  qs('#projectModal form').addEventListener('submit', saveProject);
  qs('#itemModal form').addEventListener('submit', saveItem);
  qs('#fieldsModal form').addEventListener('submit', saveFields);
  qs('#pmDelete').addEventListener('click', e => deleteProject(e.currentTarget));

  // Ask before closing a form with unsaved changes.
  const guard = (sel, ctx, snapshot) => qs(sel).addEventListener('hide.bs.modal', e => {
    const c = ctx();
    if (!c || c.saved) return;
    if (snapshot() !== c.snapshot && !confirm('Discard your unsaved changes?')) e.preventDefault();
  });
  guard('#projectModal', () => projectCtx, projectSnapshot);
  guard('#itemModal', () => itemCtx, itemSnapshot);
  guard('#fieldsModal', () => fieldsCtx, () => { syncFieldInputs(); return fieldsSnapshot() + (qs('#fmName').value.trim() ? '+' : ''); });

  qs('#itemModal').addEventListener('shown.bs.modal', () => { if (!itemCtx?.item) qs('#imName').focus(); });
  qs('#projectModal').addEventListener('shown.bs.modal', () => { if (!projectCtx?.project) qs('#pmName').focus(); });
  qs('#itemModal').addEventListener('hidden.bs.modal', () => {
    if (parseHash().name === 'item') history.replaceState(null, '', state.backHash || '#home');
    itemCtx = null;
  });

  /* ---------- start ---------- */
  async function reload() {
    const data = await api.load();
    Object.assign(state, data, { loadedAt: Date.now() });
  }

  if (!window.bootstrap) {
    fatal(new Error('Bootstrap did not load. Check that cdn.jsdelivr.net is reachable from this network.'));
    return;
  }
  qs('#appName').textContent = CFG.appName;
  document.title = CFG.appName;
  try {
    const session = await api.init();
    if (!session) return;   // signing in, or this copy of the page is MSAL's sign-in helper
    state.me = session.me;
    renderUser();
    state.choices = await api.choices();
    await reload();
    window.addEventListener('hashchange', onHashChange);
    onHashChange();
  } catch (err) {
    fatal(err);
  }

  // Pick up other people's changes when someone comes back to the tab.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !state.me || Date.now() - state.loadedAt < 60000 || qs('.modal.show')) return;
    try { await reload(); refresh(); } catch { /* keep what's on screen */ }
  });
})();
</script>

<!doctype html>
<!-- Documents (demo): ESAD's controlled documents. Sample data comes from demo.js and is kept in this browser. Changes are requested and approved in Approvals. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents</title>
<link rel="icon" type="image/png" href="https://esadservices.com/wp-content/uploads/2025/02/EsadLogowithouttext-01.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">

<div class="container py-3 py-md-4" style="max-width: 1100px; font-family: 'Segoe UI', Arial, sans-serif;">

  <!-- All apps + who you are -->
  <div class="d-flex justify-content-between align-items-center gap-2 mb-2 small text-secondary">
    <a href="index.html" class="text-secondary text-decoration-none text-nowrap"><i class="bi bi-grid-3x3-gap me-1"></i>All apps</a>
    <span class="text-nowrap"><i class="bi bi-person-circle me-1"></i><span id="who"></span></span>
  </div>

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between gap-2 border-bottom pb-3 mb-3">
    <div class="d-flex align-items-center gap-3" style="min-width: 0;">
      <a href="index.html" class="flex-shrink-0"><img src="https://esadservices.com/wp-content/uploads/2025/02/EsadLogowithouttext-01.png" alt="ESAD" style="height: 48px; width: auto;"></a>
      <h1 class="h4 mb-0 text-truncate"><a href="#" class="text-dark text-decoration-none">Documents</a></h1>
    </div>
    <a href="approvals.html#new/document" class="btn btn-sm btn-primary flex-shrink-0" title="New document or change request"><i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline ms-1">New request</span></a>
  </div>

  <!-- Menu + search -->
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 border-bottom mb-4">
    <ul class="nav nav-underline gap-3" id="nav">
      <li class="nav-item"><a class="nav-link" href="#" data-nav="home">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#all" data-nav="all">All documents</a></li>
    </ul>
    <form id="searchForm" class="pb-2 flex-grow-1 flex-md-grow-0" style="min-width: 240px;" role="search">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-white"><i class="bi bi-search text-secondary"></i></span>
        <input type="search" id="q" class="form-control" placeholder="Search by title or ID" aria-label="Search documents">
      </div>
    </form>
  </div>

  <div id="view"></div>

  <div class="border-top mt-5 pt-3 d-flex flex-wrap justify-content-between gap-2 text-secondary" style="font-size: 12px;">
    <span>Demo with sample data. Changes are saved in this browser only.</span>
    <button type="button" class="btn btn-link btn-sm p-0 text-secondary text-decoration-none" style="font-size: 12px;" id="resetBtn">Reset demo data</button>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center text-bg-dark border-0" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body small" id="toastMsg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="demo.js"></script>
<script>
(() => {
  'use strict';
  const { DOC_DEPARTMENTS, DOC_TYPES, docLabel, docId } = DEMO;
  const me = DEMO.ME;
  const REVIEW_WINDOW = 30;   // days: your documents due for review within this window show on Home

  // Guidance pages: [title, icon, content]
  const INFO = {
    guidelines: ['Guidelines for writing controlled documents', 'bi-pencil-square', `<ul class="small">
      <li>Start from the approved template for the document type.</li>
      <li>Give the document a clear purpose, scope and owner.</li>
      <li>Use short, numbered steps and plain language.</li>
      <li>Refer to related documents by their Document ID.</li>
      <li>Don't edit the Document ID or revision. They are set when the change is approved.</li></ul>`],
    templates: ['Document templates', 'bi-file-earmark-ruled', `<div class="list-group">${DOC_TYPES.map(t => `
      <div class="list-group-item bg-light d-flex align-items-center gap-2"><i class="bi bi-file-earmark-word text-secondary"></i>
        <span class="small flex-grow-1">${t.name} template.docx</span><button type="button" class="btn btn-sm btn-outline-secondary" data-demo>Download</button></div>`).join('')}</div>`],
    ids: ['Document ID numbering', 'bi-hash', `<p class="small">Format: <code>ESAD-[Department]-[Type]-[Serial]-[Revision]</code>, for example <code>ESAD-HR-PR-01-V1.0</code>.</p>
      <div class="row g-3">
        <div class="col-12 col-md-6">${codeTable('Department', DOC_DEPARTMENTS)}</div>
        <div class="col-12 col-md-4">${codeTable('Type', DOC_TYPES)}</div>
      </div>`],
    process: ['How a document gets approved', 'bi-journal-text', `<ol class="small">
      <li><b>Request</b> a new document or a change, with the draft attached. Requests go to Approvals.</li>
      <li><b>Review</b> by your line manager.</li>
      <li><b>CEO approval</b> for policies.</li>
      <li><b>Published</b> here with a new revision once it's approved.</li></ol>`],
  };
  function codeTable(label, rows) {
    return `<div class="table-responsive border rounded"><table class="table table-sm mb-0">
      <thead class="table-light"><tr><th class="small ps-3">${label}</th><th class="small pe-3">Code</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="small ps-3">${r.name}</td><td class="small pe-3"><code>${r.code}</code></td></tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------- helpers ---------- */
  const qs = (sel, root = document) => root.querySelector(sel);
  const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const low = v => String(v ?? '').toLowerCase();
  const fmtDate = s => { const d = new Date(`${s}T00:00`); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const inDays = n => DEMO.ymd(new Date(Date.now() + n * 864e5));
  const isActive = d => d.status === 'Active';
  const badge = d => `<span class="badge fw-normal ${isActive(d) ? 'text-bg-success' : 'text-bg-secondary'}">${esc(d.status)}</span>`;
  const docLink = d => `#doc/${encodeURIComponent(d.code)}`;
  const changeUrl = d => `approvals.html#new/document?change=Revision&document=${encodeURIComponent(docLabel(d))}`;
  const view = qs('#view');
  let data = DEMO.documents();
  const ui = { dept: '', type: '', archive: false, sort: { key: 'effective', dir: -1 } };

  function toast(msg) {
    qs('#toastMsg').textContent = msg;
    bootstrap.Toast.getOrCreateInstance(qs('#toast'), { delay: 3000 }).show();
  }
  function setNav(name) {
    qsa('#nav [data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === name));
  }
  const dueDocs = () => data.docs.filter(d => isActive(d) && d.owner === me && d.nextReview <= inDays(REVIEW_WINDOW))
    .sort((a, b) => a.nextReview.localeCompare(b.nextReview));

  /* ---------- Home ---------- */
  function renderHome() {
    setNav('home');
    const due = dueDocs();
    const recent = data.docs.filter(isActive).sort((a, b) => b.effective.localeCompare(a.effective)).slice(0, 6);
    view.innerHTML = `
      ${due.length ? `
      <h2 class="h5 mb-1 text-dark">Due for review <span class="text-secondary fw-normal">(${due.length})</span></h2>
      <p class="small text-secondary mb-3">You own these. Confirm they're still correct, or request a change.</p>
      <div class="list-group mb-4">${due.map(d => `
        <div class="list-group-item bg-light d-flex flex-wrap align-items-center gap-2">
          <div class="small me-auto" style="min-width: 0;">
            <a href="${docLink(d)}" class="text-decoration-none">${esc(d.title)}</a>
            <div class="text-secondary" style="font-size: 12px;">${esc(docId(d))} · review by ${esc(fmtDate(d.nextReview))}</div>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-ok="${esc(d.code)}">No change needed</button>
            <a href="${esc(changeUrl(d))}" class="btn btn-sm btn-outline-primary">Request a change</a>
          </div>
        </div>`).join('')}</div>` : ''}

      <h2 class="h5 mb-3 text-dark">Browse by department</h2>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3 mb-4">${DOC_DEPARTMENTS.map(d => `
        <div class="col"><a href="#all?dept=${encodeURIComponent(d.name)}" class="card h-100 bg-light border text-decoration-none text-reset">
          <div class="card-body p-3 text-center"><i class="bi ${d.icon} fs-2 text-primary"></i><p class="fw-semibold mb-0 mt-2" style="font-size: 13px;">${esc(d.name)}</p></div>
        </a></div>`).join('')}</div>

      <h2 class="h5 mb-3 text-dark">Browse by type</h2>
      <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">${DOC_TYPES.map(t => `
        <div class="col"><a href="#all?type=${t.name}" class="card h-100 bg-light border text-decoration-none text-reset">
          <div class="card-body p-3"><i class="bi ${t.icon} fs-4 text-secondary"></i>
            <p class="fw-semibold mb-0 mt-2" style="font-size: 14px;">${t.plural}</p><p class="text-muted mb-0" style="font-size: 12px;">${t.desc}</p></div>
        </a></div>`).join('')}</div>

      <hr class="mb-4">
      <div class="row g-4">
        <div class="col-12 col-md-7">
          <h2 class="h5 mb-3 text-dark">Recently published</h2>
          <div class="list-group">${recent.map(d => `
            <a href="${docLink(d)}" class="list-group-item list-group-item-action bg-light d-flex align-items-center gap-2">
              <i class="bi bi-file-earmark-text text-secondary"></i>
              <span class="small flex-grow-1" style="min-width: 0;">${esc(d.title)}<span class="d-block text-muted" style="font-size: 12px;">${esc(docId(d))}</span></span>
              <span class="text-muted text-nowrap" style="font-size: 12px;">${esc(fmtDate(d.effective))}</span>
            </a>`).join('')}</div>
        </div>
        <div class="col-12 col-md-5">
          <h2 class="h5 mb-3 text-dark">Guidance and templates</h2>
          <div class="list-group mb-4">${Object.entries(INFO).map(([k, [title, icon]]) => `
            <a href="#info/${k}" class="list-group-item list-group-item-action bg-light d-flex align-items-center gap-2"><i class="bi ${icon} text-secondary"></i><span class="small">${esc(title)}</span></a>`).join('')}</div>
          <h2 class="h5 mb-3 text-dark">Need help?</h2>
          <div class="card bg-light border"><div class="card-body small">
            <p class="mb-1"><i class="bi bi-envelope me-2 text-secondary"></i>Document Control: <a href="mailto:documentcontrol@esadservices.com">documentcontrol@esadservices.com</a></p>
            <p class="mb-0"><i class="bi bi-headset me-2 text-secondary"></i>IT Helpdesk: <a href="mailto:itsupport@esadservices.com">itsupport@esadservices.com</a></p>
          </div></div>
        </div>
      </div>`;
  }

  /* ---------- All documents ---------- */
  const COLS = [['code', 'Document ID'], ['title', 'Title'], ['dept', 'Department'], ['type', 'Type'], ['status', 'Status'], ['effective', 'Effective']];
  function renderAll(params) {
    setNav('all');
    Object.assign(ui, { dept: params.get('dept') || '', type: params.get('type') || '', archive: params.get('obsolete') === '1' });
    if (params.has('q')) qs('#q').value = params.get('q');
    const select = (id, label, list, value) => `<select id="${id}" class="form-select form-select-sm w-auto flex-grow-1 flex-md-grow-0" aria-label="${label}">
      <option value="">All ${label.toLowerCase()}s</option>${list.map(x => `<option${x.name === value ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
    view.innerHTML = `
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        ${select('fDept', 'Department', DOC_DEPARTMENTS, ui.dept)}
        ${select('fType', 'Type', DOC_TYPES, ui.type)}
        <div class="form-check form-switch small mb-0 ms-md-auto">
          <input class="form-check-input" type="checkbox" role="switch" id="fArchive"${ui.archive ? ' checked' : ''}>
          <label class="form-check-label" for="fArchive">Include superseded and obsolete</label>
        </div>
      </div>
      <div id="list"></div>`;
    qs('#fDept').addEventListener('change', e => { ui.dept = e.target.value; drawAll(); });
    qs('#fType').addEventListener('change', e => { ui.type = e.target.value; drawAll(); });
    qs('#fArchive').addEventListener('change', e => { ui.archive = e.target.checked; drawAll(); });
    drawAll();
  }
  function drawAll() {
    const q = low(qs('#q').value.trim()), { key, dir } = ui.sort;
    const shown = data.docs.filter(d => ui.archive || isActive(d));
    const list = shown.filter(d => (!ui.dept || d.dept === ui.dept) && (!ui.type || d.type === ui.type) && (!q || low(d.title).includes(q) || low(docId(d)).includes(q)))
      .sort((a, b) => String(a[key]).localeCompare(String(b[key]), undefined, { numeric: true }) * dir);
    qs('#list').innerHTML = !list.length ? '<p class="small text-secondary">No documents match.</p>' : `
      <div class="d-none d-md-block table-responsive border rounded">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-light"><tr>${COLS.map(([k, label], i) => `<th class="small text-nowrap${i === 0 ? ' ps-3' : ''}${i === COLS.length - 1 ? ' pe-3' : ''}" role="button" data-sort="${k}">${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
          <tbody>${list.map(d => `
            <tr data-href="${docLink(d)}" style="cursor: pointer;">
              <td class="small text-nowrap ps-3">${esc(docId(d))}</td>
              <td class="small"><a href="${docLink(d)}" class="text-decoration-none">${esc(d.title)}</a></td>
              <td class="small">${esc(d.dept)}</td>
              <td class="small">${esc(d.type)}</td>
              <td>${badge(d)}</td>
              <td class="small text-nowrap pe-3">${esc(fmtDate(d.effective))}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="list-group d-md-none">${list.map(d => `
        <a href="${docLink(d)}" class="list-group-item list-group-item-action py-2">
          <div class="d-flex justify-content-between align-items-start gap-2"><span class="small fw-semibold text-primary" style="min-width: 0;">${esc(d.title)}</span>${badge(d)}</div>
          <div class="text-secondary mt-1" style="font-size: 12px;">${esc(docId(d))} · ${esc(d.dept)} · ${esc(fmtDate(d.effective))}</div>
        </a>`).join('')}</div>
      <p class="small text-secondary mt-2 mb-0">${list.length} of ${shown.length} documents</p>`;
  }

  /* ---------- One document ---------- */
  function renderDoc(code) {
    setNav('all');
    const d = data.docs.find(x => x.code === code);
    const back = '<a href="#all" class="small text-decoration-none d-inline-block mb-2"><i class="bi bi-arrow-left me-1"></i>All documents</a>';
    if (!d) { view.innerHTML = `${back}<p class="small text-secondary">This document doesn't exist.</p>`; return; }
    const field = (label, value) => `<div class="col"><div class="text-secondary" style="font-size: 12px;">${label}</div><div class="small">${esc(value) || '—'}</div></div>`;
    view.innerHTML = `${back}
      <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
        <div style="min-width: 0;">
          <div class="small text-secondary">${esc(docId(d))}</div>
          <div class="d-flex flex-wrap align-items-center gap-2"><h2 class="h4 mb-0 text-dark">${esc(d.title)}</h2>${badge(d)}</div>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-primary" data-demo><i class="bi bi-box-arrow-up-right me-1"></i>Open</button>
          ${isActive(d) ? `<a href="${esc(changeUrl(d))}" class="btn btn-sm btn-outline-secondary">Request a change</a>` : ''}
        </div>
      </div>
      <div class="card bg-light border"><div class="card-body p-3">
        <div class="row row-cols-2 row-cols-md-3 g-3">
          ${field('Department', d.dept)}${field('Type', d.type)}${field('Revision', d.revision)}
          ${field('Effective', fmtDate(d.effective))}${field('Next review', fmtDate(d.nextReview))}${field('Owner', d.owner === me ? 'You' : DEMO.person(d.owner).name)}
        </div>
      </div></div>`;
  }

  function renderInfo(key) {
    setNav('home');
    const [title, , html] = INFO[key];
    view.innerHTML = `<a href="#" class="small text-decoration-none d-inline-block mb-2"><i class="bi bi-arrow-left me-1"></i>Home</a>
      <h2 class="h5 mb-3 text-dark">${esc(title)}</h2><div style="max-width: 760px;">${html}</div>`;
  }

  /* ---------- routing and events ---------- */
  function route() {
    const [path, query = ''] = location.hash.replace(/^#\/?/, '').split('?');
    const [name, arg = ''] = path.split('/');
    if (name === 'all') renderAll(new URLSearchParams(query));
    else if (name === 'doc') renderDoc(decodeURIComponent(arg));
    else if (name === 'info' && INFO[arg]) renderInfo(arg);
    else renderHome();
  }
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

  view.addEventListener('click', e => {
    const t = e.target;
    const sort = t.closest('[data-sort]');
    if (sort) { const k = sort.dataset.sort; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : 1 }; drawAll(); return; }
    const ok = t.closest('[data-ok]');
    if (ok) {
      const d = data.docs.find(x => x.code === ok.dataset.ok);
      d.nextReview = inDays(365);
      DEMO.saveDocuments(data);
      toast(`${d.title}: next review ${fmtDate(d.nextReview)}`);
      renderHome();
      return;
    }
    if (t.closest('[data-demo]')) { toast('In the live version, this opens the file in SharePoint.'); return; }
    if (t.closest('a, button, input, select, label')) return;
    const row = t.closest('[data-href]');
    if (row) location.hash = row.dataset.href;
  });

  qs('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const target = '#all?q=' + encodeURIComponent(qs('#q').value.trim());
    if (location.hash === target) route(); else location.hash = target;
  });
  qs('#q').addEventListener('input', () => { if (qs('#list')) drawAll(); });

  qs('#resetBtn').addEventListener('click', () => {
    if (!confirm('Reset the demo data in all apps? Your changes will be removed.')) return;
    DEMO.reset();
    data = DEMO.documents();
    toast('Demo data reset');
    route();
  });

  // Approved changes arrive from Approvals: pick them up when you come back to this page.
  const reload = () => { data = DEMO.documents(); route(); };
  window.addEventListener('storage', e => { if ([DEMO.KEYS.documents, DEMO.KEYS.approvals].includes(e.key)) reload(); });
  window.addEventListener('pageshow', e => { if (e.persisted) reload(); });

  qs('#who').textContent = `${DEMO.person(me).name} · ${DEMO.person(me).title}`;
  route();
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
